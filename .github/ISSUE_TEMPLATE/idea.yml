name: An idea
description: Something the hub should do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the situation in your build, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to work on it?
      options:
        - label: Yes, I can open a pull request
