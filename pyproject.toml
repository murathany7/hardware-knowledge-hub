[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hardware-knowledge-hub"
version = "0.1.0"
description = "A local project notebook for your first hardware build"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
hardware-knowledge-hub = "hub_package:main"

[tool.setuptools]
packages = ["hub_package"]

[tool.setuptools.package-data]
hub_package = ["template/**/*"]
